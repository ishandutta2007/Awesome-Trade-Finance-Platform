<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" />
      <circle cx="40" cy="40" r="1" fill="rgba(56, 189, 248, 0.2)" />
    </pattern>
  </defs>

  <style>
    @keyframes pulse-flow {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes float-slow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes float-reverse {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(6px); }
    }
    @keyframes badge-glow {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.9; }
    }
    .flowing-path {
      stroke-dasharray: 12, 12;
      animation: pulse-flow 6s linear infinite;
    }
    .flowing-path-fast {
      stroke-dasharray: 8, 8;
      animation: pulse-flow 3s linear infinite reverse;
    }
    .float-card-1 {
      animation: float-slow 5s ease-in-out infinite;
    }
    .float-card-2 {
      animation: float-reverse 6s ease-in-out infinite;
    }
    .glow-pulse {
      animation: badge-glow 3s ease-in-out infinite;
    }
    .title-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .sub-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
    }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="380" rx="16" fill="url(#bg-grad)" />
  <rect width="1200" height="380" rx="16" fill="url(#grid)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="200" cy="100" r="140" fill="#38bdf8" opacity="0.08" filter="url(#glow)" />
  <circle cx="1050" cy="280" r="160" fill="#818cf8" opacity="0.08" filter="url(#glow)" />
  <circle cx="600" cy="350" r="120" fill="#c084fc" opacity="0.05" filter="url(#glow)" />

  <!-- Connected World Mesh / Trade Corridors -->
  <g opacity="0.6">
    <path d="M 120 280 Q 300 200 480 250 T 800 220 T 1100 290" fill="none" stroke="rgba(56, 189, 248, 0.4)" stroke-width="2" stroke-linecap="round" class="flowing-path" />
    <path d="M 100 180 Q 400 120 700 180 T 1120 160" fill="none" stroke="rgba(129, 140, 248, 0.3)" stroke-width="1.5" stroke-linecap="round" class="flowing-path-fast" />
    <path d="M 220 320 Q 550 360 880 300 T 1150 240" fill="none" stroke="rgba(192, 132, 252, 0.25)" stroke-width="1" stroke-linecap="round" />
  </g>

  <!-- Left Side Header Info -->
  <g transform="translate(60, 65)">
    <!-- Category Pill Tag -->
    <rect width="230" height="32" rx="16" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1" />
    <circle cx="16" cy="16" r="5" fill="#38bdf8" class="glow-pulse" />
    <text x="32" y="21" fill="#38bdf8" class="sub-text" font-size="13" font-weight="600" letter-spacing="0.5">🌐 GLOBAL TRADE ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="82" fill="#ffffff" class="title-text" font-size="42">
      Awesome Trade Finance
    </text>
    <text x="0" y="126" fill="url(#accent-grad)" class="title-text" font-size="40">
      Platforms &amp; Ecosystem
    </text>

    <!-- Subtitle / Value Prop -->
    <text x="0" y="168" fill="#94a3b8" class="sub-text" font-size="16">
      Curated index of Enterprise SaaS &amp; Open-Source tools for Letters of Credit (LCs),
    </text>
    <text x="0" y="192" fill="#94a3b8" class="sub-text" font-size="16">
      Bank Guarantees, Supply Chain Finance, e-Bills of Lading &amp; Verifiable Credentials.
    </text>

    <!-- Feature Tags -->
    <g transform="translate(0, 222)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="125" height="30" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
      <text x="14" y="20" fill="#e2e8f0" class="sub-text" font-size="12" font-weight="500">⚡ Digital LCs</text>

      <!-- Tag 2 -->
      <rect x="135" y="0" width="135" height="30" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
      <text x="149" y="20" fill="#e2e8f0" class="sub-text" font-size="12" font-weight="500">📜 e-BL / MLETR</text>

      <!-- Tag 3 -->
      <rect x="280" y="0" width="145" height="30" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
      <text x="294" y="20" fill="#e2e8f0" class="sub-text" font-size="12" font-weight="500">🔗 Blockchain &amp; DLT</text>

      <!-- Tag 4 -->
      <rect x="435" y="0" width="145" height="30" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
      <text x="449" y="20" fill="#e2e8f0" class="sub-text" font-size="12" font-weight="500">🤖 AI Scrutiny &amp; AML</text>
    </g>
  </g>

  <!-- Right Side Interactive Graphic Cards -->
  <!-- Glass Card 1: Enterprise SaaS Network -->
  <g transform="translate(860, 48)" class="float-card-1" filter="url(#soft-shadow)">
    <rect width="280" height="135" rx="14" fill="url(#card-grad)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5" />
    
    <circle cx="34" cy="36" r="16" fill="rgba(56, 189, 248, 0.2)" />
    <path d="M 28 36 L 33 41 L 41 31" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <text x="60" y="34" fill="#ffffff" class="title-text" font-size="16" font-weight="700">Enterprise SaaS</text>
    <text x="60" y="52" fill="#94a3b8" class="sub-text" font-size="12">Surecomp • Finastra • Komgo</text>
    
    <line x1="20" y1="72" x2="260" y2="72" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    
    <text x="20" y="96" fill="#64748b" class="sub-text" font-size="11" font-weight="600">MARKET COVERAGE</text>
    <text x="20" y="118" fill="#34d399" class="title-text" font-size="18" font-weight="700">Multi-Billion $</text>
    <text x="145" y="118" fill="#94a3b8" class="sub-text" font-size="12">Trade Volume</text>
  </g>

  <!-- Glass Card 2: Open Source Smart Contracts & DLT -->
  <g transform="translate(830, 205)" class="float-card-2" filter="url(#soft-shadow)">
    <rect width="310" height="135" rx="14" fill="url(#card-grad)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5" />
    
    <circle cx="34" cy="36" r="16" fill="rgba(192, 132, 252, 0.2)" />
    <path d="M 28 32 L 34 27 L 40 32 L 34 37 Z M 28 34 L 34 39 L 34 45 L 28 40 Z M 40 34 L 34 39 L 34 45 L 40 40 Z" fill="none" stroke="#c084fc" stroke-width="1.8" stroke-linejoin="round" />
    
    <text x="60" y="34" fill="#ffffff" class="title-text" font-size="16" font-weight="700">Open-Source DLT &amp; VC</text>
    <text x="60" y="52" fill="#94a3b8" class="sub-text" font-size="12">Hyperledger • Corda • TradeTrust</text>
    
    <line x1="20" y1="72" x2="290" y2="72" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    
    <g transform="translate(20, 88)">
      <circle cx="6" cy="18" r="4" fill="#38bdf8" />
      <text x="18" y="22" fill="#e2e8f0" class="sub-text" font-size="12">Solidity LC Workflows &amp; Verifiers</text>
    </g>
  </g>

  <!-- Floating Connection Nodes / Dots -->
  <g fill="#38bdf8" filter="url(#glow)">
    <circle cx="480" cy="250" r="4" />
    <circle cx="800" cy="220" r="5" />
    <circle cx="700" cy="180" r="4" />
  </g>
</svg>
